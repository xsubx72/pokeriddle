<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PokeRiddle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="contenedor-principal">
    <div class="columna-izquierda">
        <h1>Adivina el Pokémon</h1>
        <p id="modo-visual">Modo actual: Básico</p>
         <div class="grupo-modos">
            <button id="modo-basico" class="modo-btn">Básico</button>
            <button id="modo-racha" class="modo-btn">Racha</button>
            <button id="modo-pokedex" class="modo-btn">Pokédex</button>
          </div>
          <select id="selector-generacion">
          <option value="1,151">Generación 1</option>
          <option value="152,251">Generación 2</option>
          <option value="252,386">Generación 3</option>
          <option value="387,493">Generación 4</option>
          <option value="494,649">Generación 5</option>
          <option value="650,721">Generación 6</option>
          <option value="722,809">Generación 7</option>
          <option value="810,905">Generación 8</option>
          <option value="906,1025">Generación 9</option>
          <option value="1,1025">Todas las generaciones</option>
          </select>
    </div>
    <div class="columna-central">
       <div class="marco-pokemon">
        <img id="pokemon-img" src="" style="filter: brightness(0);">
        </div>
       <input type="text" id="respuesta-usuario" placeholder="¿Qué Pokémon es?">
       <ul id="lista-sugerencias"></ul>
       <button id="boton-adivinar">Adivinar</button>
       <button id="boton-siguiente">Siguiente Pokémon</button>
    </div>
    <div class="columna-derecha">
     <div class="tarjeta-resultado">
        <p id="resultado"></p>
     </div>
     <div class="tarjeta-pistas">
        <h3>Pistas</h3>
        <p id="pistas"></p>
     </div>
     <div class="tarjeta-racha" id="racha-visual" style="display: none;">
       <div class="racha-numero">
          <span class="racha-label">Racha actual</span>
          <span class="racha-valor" id="racha-actual-num">0</span>
       </div>
     <div class="racha-numero">
         <span class="racha-label">Récord</span>
         <span class="racha-valor" id="mejor-racha-num">0</span>
     </div>
    </div>
      <button id="boton-progreso" style="display: none;">Ver progreso</button>
      <Button id="boton-reiniciar" style="display: none;">Reiniciar progreso</button>
      <div id="overlay-progreso" style="display: none;">
        <div id="cuadricula-progreso"></div>
      </div>
    </div>
  </div>
  <script>
    // aquí vamos a escribir tu código
    let pokemonActual; // aquí guardaremos los datos del pokémon actual
    let listaNombres = [];
    let rangoMin = 1;
    let rangoMax = 151;
    let intentos = 0;
    let modoActual = "basico"; // Modo por defecto
    let rachaActual = 0; // Contador de racha
    let mejorRacha = 0; // Mejor racha alcanzada
    let intentosPokedex = 0;
    let pokedexCompletada = [];

    function actualizarBotonActivo(idBotonActivo) {
      const botones = document.querySelectorAll(".modo-btn");
      botones.forEach(function(boton) {
        boton.classList.remove("modo-btn-activo");
      });
      document.getElementById(idBotonActivo).classList.add("modo-btn-activo");
    }

   const guardado = localStorage.getItem("pokedexCompletada");
    if (guardado) {
      pokedexCompletada = JSON.parse(guardado);
    }

    fetch("https://pokeapi.co/api/v2/pokemon?limit=1025")
      .then(respuesta => respuesta.json())
      .then(datos=>{
    // aquí hay que extraer solo los nombres del array "results"
    // y guardarlos en listaNombres
    const listapokemons = datos.results;
    const nombres = listapokemons.map(pokemon => pokemon.name);
    listaNombres = nombres;
  })
function mostrarCuadricula() {
  let html = "";
  
  for (let i = rangoMin; i <= rangoMax; i++) {
    if (pokedexCompletada.includes(i)) {
      const nombre = listaNombres[i - 1];
      html += `<span style="background-color: lightgreen; padding: 4px; margin: 2px; display: inline-block; text-align: center;">#${i}<br>${nombre}</span>`;
    } else {
      html += `<span style="background-color: lightgray; padding: 4px; margin: 2px; display: inline-block; text-align: center;">#${i}<br>?</span>`;
    }
  }
  
  document.getElementById("cuadricula-progreso").innerHTML = html;
}
    function cargarpokemonNuevo() {
      const numeroRandom = Math.floor(Math.random() * (rangoMax - rangoMin + 1)) + rangoMin; // Genera un número aleatorio entre rangoMin y rangoMax
      fetch(`https://pokeapi.co/api/v2/pokemon/${numeroRandom}`)
        .then(respuesta => respuesta.json())
        .then(datos => {
          pokemonActual = datos;
          document.getElementById("pokemon-img").src = datos.sprites.front_default;
          document.getElementById("pokemon-img").style.filter = "brightness(0)";
          document.getElementById("resultado").textContent = "";
          document.getElementById("respuesta-usuario").value = "";
          intentos = 0;
          document.getElementById("pistas").innerHTML = ""; // Limpiar las pistas anteriores
          intentosPokedex = 0;
        });
    }
    function seleccionarSugerencia(nombre) {
      document.getElementById("respuesta-usuario").value = nombre;
      document.getElementById("lista-sugerencias").innerHTML = "";
    }

    cargarpokemonNuevo(); // Carga un Pokémon al iniciar la página
    
    document.getElementById("boton-siguiente").addEventListener("click", function() {
      cargarpokemonNuevo();
    });

    document.getElementById("boton-adivinar").addEventListener("click", function() {
      const respuestaUsuario = document.getElementById("respuesta-usuario").value.toLowerCase();
      const nombrePokemon = pokemonActual.name.toLowerCase();

      if (modoActual === "racha") {
        if (respuestaUsuario === nombrePokemon) {
          rachaActual = rachaActual + 1;
          if (rachaActual > mejorRacha) {
            mejorRacha = rachaActual;
          }
          document.getElementById("racha-actual-num").textContent = rachaActual;
          document.getElementById("mejor-racha-num").textContent = mejorRacha;
          document.getElementById("pokemon-img").style.filter = "brightness(1)";
       } else {
         rachaActual = 0;
           document.getElementById("resultado").textContent = "Falleste. Era " + pokemonActual.name + ".";
           document.getElementById("pokemon-img").style.filter = "brightness(1)";
            document.getElementById("racha-actual-num").textContent = rachaActual; // <-- añadir esta
           document.getElementById("mejor-racha-num").textContent = mejorRacha;
        }
   }else if (modoActual === "pokedex") {
       if (respuestaUsuario === nombrePokemon) {
        document.getElementById("resultado").textContent = "¡Correcto! Es " + pokemonActual.name + ".";
        document.getElementById("pokemon-img").style.filter = "brightness(1)";
        if (!pokedexCompletada.includes(pokemonActual.id)) {
            pokedexCompletada.push(pokemonActual.id);
            localStorage.setItem("pokedexCompletada", JSON.stringify(pokedexCompletada));
            mostrarCuadricula(); // Actualiza la cuadrícula de progreso
          }
        setTimeout(function() {
            cargarpokemonNuevo();
          }, 2500); // Espera 2 segundos antes de cargar el siguiente Pokémon
      } else {
       intentosPokedex = intentosPokedex + 1;
       document.getElementById("resultado").textContent = "Incorrecto. Llevas " + intentosPokedex + " intento(s).";

       if (intentosPokedex === 1) {
      document.getElementById("pistas").innerHTML += "<div class='pista-item'>Tipo(s): " + pokemonActual.types.map(t => t.type.name).join(", ") + "</div>";
      }

       if (intentosPokedex === 2) {
      document.getElementById("pistas").innerHTML += "<div class='pista-item'>Pista: es el número " + pokemonActual.id + " en la Pokédex.</div>";
      }

       if (intentosPokedex === 3) {
      document.getElementById("resultado").textContent = "Incorrecto. Siguiente pokemon";
      setTimeout(function() {
        cargarpokemonNuevo();
      }, 2500);
    }
  }
     }else {
       if (respuestaUsuario === nombrePokemon) {
        document.getElementById("resultado").textContent = "¡Correcto! Es " + pokemonActual.name + ".";
        document.getElementById("pokemon-img").style.filter = "brightness(1)";
       } else {
        intentos = intentos + 1;
        document.getElementById("resultado").textContent = "Incorrecto. Llevas " + intentos + " intento(s).";
         if (intentos === 2) {
         const alturaM = pokemonActual.height / 10; // Convertir a metros
          const pesoKg = pokemonActual.weight / 10; // Convertir a kilogramos
          document.getElementById("pistas").innerHTML += "<div class='pista-item'>Peso/Altura: " + pesoKg + " kg, " + alturaM + " m</div>";
            
        }
         if (intentos === 3) {
          document.getElementById("pistas").innerHTML += "<div class='pista-item'>Pista: tipo(s) del Pokémon: " + pokemonActual.types.map(t => t.type.name).join(", ") + "</div>";
        }
         if (intentos === 4 && rangoMin === 1 && rangoMax === 1025) {
          let generacion;
           if (pokemonActual.id <= 151) {
            generacion = "Generación 1";
            } else if (pokemonActual.id <= 251) {
            generacion = "Generación 2";
           } else if (pokemonActual.id <= 386) {
            generacion = "Generación 3";
           } else if (pokemonActual.id <= 493) {
            generacion = "Generación 4";
           } else if (pokemonActual.id <= 649) {
            generacion = "Generación 5";
           } else if (pokemonActual.id <= 721) {
            generacion = "Generación 6";
            } else if (pokemonActual.id <= 809) {
            generacion = "Generación 7";
            } else if (pokemonActual.id <= 905) {
            generacion = "Generación 8";
            } else {
            generacion = "Generación 9";
           }
         document.getElementById("pistas").innerHTML += "<div class='pista-item'>Generación: " + generacion + "</div>";
         }
          if (intentos === 5) {
          document.getElementById("pistas").innerHTML += "<div class='pista-item'>Pista: es el número " + pokemonActual.id + " en la Pokédex.</div>";
          }
         if (intentos === 6) {
            document.getElementById("resultado").textContent = "¡Has perdido! El Pokémon era " + pokemonActual.name + ".";
            document.getElementById("pokemon-img").style.filter = "brightness(1)";
          }
        } 
      }
    });

    document.getElementById("respuesta-usuario").addEventListener("input", function() {
      const textoEscrito = document.getElementById("respuesta-usuario").value.toLowerCase();
      const coincidencias = listaNombres.filter(nombre => nombre.startsWith(textoEscrito));
      const html = coincidencias.map(nombre => `<li onclick="seleccionarSugerencia('${nombre}')">${nombre}</li>`).join("");
      document.getElementById("lista-sugerencias").innerHTML = html;
    });
    
    document.getElementById("selector-generacion").addEventListener("change", function() {
     const valorSeleccionado = document.getElementById("selector-generacion").value;
     const rango = valorSeleccionado.split(",");
     rangoMin = parseInt(rango[0]);
     rangoMax = parseInt(rango[1]); 
      
     cargarpokemonNuevo(); // Carga un Pokémon dentro del rango seleccionado
    
    });
    
    document.getElementById("modo-basico").addEventListener("click", function() {
      modoActual = "basico";
      actualizarBotonActivo("modo-basico");
      document.getElementById("modo-visual").textContent = "Modo actual: Básico";
      document.getElementById("racha-visual").style.display = "none";
      document.getElementById("boton-progreso").style.display = "none"; // Oculta el botón de progreso en modo básico
      document.getElementById("cuadricula-progreso").style.display = "none"; // Oculta la lista de progreso en modo básico
      document.getElementById("boton-reiniciar").style.display = "none"; // Oculta el botón de reiniciar progreso en modo básico
      cargarpokemonNuevo();
    });
    
    document.getElementById("modo-racha").addEventListener("click", function() {
      modoActual = "racha";
      actualizarBotonActivo("modo-racha");
      document .getElementById("modo-visual").textContent = "Modo actual: Racha";
      document.getElementById("racha-visual").style.display = "block";
      document.getElementById("boton-progreso").style.display = "none"; // Oculta el botón de progreso en modo racha
      document.getElementById("cuadricula-progreso").style.display = "none"; // Oculta la lista de progreso en modo racha
      document.getElementById("boton-reiniciar").style.display = "none"; // Oculta el botón de reiniciar progreso en modo racha
      cargarpokemonNuevo();
    });
    
    document.getElementById("modo-pokedex").addEventListener("click", function() {
      modoActual = "pokedex";
      actualizarBotonActivo("modo-pokedex");
      document.getElementById("modo-visual").textContent = "Modo actual: Pokédex";
      document.getElementById("racha-visual").style.display = "none";
      document.getElementById("boton-progreso").style.display = "block"; // Muestra el botón de progreso en modo Pokédex
      document.getElementById("cuadricula-progreso").style.display = "block"; // Muestra la lista de progreso al cambiar a modo Pokédex
      document.getElementById("boton-reiniciar").style.display = "block"; // Muestra el botón de reiniciar progreso en modo Pokédex
      cargarpokemonNuevo();
    });

  document.getElementById("boton-progreso").addEventListener("click", function() {
    const overlay = document.getElementById("overlay-progreso");
  
  if (overlay.style.display === "none" || overlay.style.display === "") {
    mostrarCuadricula();
    overlay.style.display = "flex";
  } else {
    overlay.style.display = "none";
  }
});

   document.getElementById("boton-reiniciar").addEventListener("click", function() {
  if (confirm("¿Estás seguro de que quieres reiniciar tu progreso?")) {
    pokedexCompletada = [];
    localStorage.removeItem("pokedexCompletada");
    mostrarCuadricula(); // Actualiza la cuadrícula de progreso
  }
});

document.getElementById("overlay-progreso").addEventListener("click", function(event) {
  if (event.target.id === "overlay-progreso") {
    document.getElementById("overlay-progreso").style.display = "none";
  }
});
  </script>
</body>
</html>
